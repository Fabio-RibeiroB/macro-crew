# REVIEW TEMPLATE: replace the site's existing vhosts; do not append duplicates.
# Keep existing certificate settings and ACME method. No production change is automatic.
<VirtualHost *:80>
    ServerName finstats.fabio.org.uk
    ServerAlias www.finstats.fabio.org.uk
    DocumentRoot /var/www/html
    # Fixed target avoids using the untrusted Host header in a redirect.
    Redirect permanent / https://finstats.fabio.org.uk/
</VirtualHost>

<VirtualHost *:443>
    ServerName finstats.fabio.org.uk
    ServerAlias www.finstats.fabio.org.uk
    DocumentRoot /home/finstats/public_html/macro-crew/dist
    DirectoryIndex index.html
    SSLEngine on
    SSLCertificateFile /home/finstats/ssl.cert
    SSLCertificateKeyFile /home/finstats/ssl.key
    SSLCACertificateFile /home/finstats/ssl.ca
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

    <Directory /home/finstats/public_html/macro-crew/dist>
        Options SymLinksIfOwnerMatch
        AllowOverride FileInfo
        Require all granted
        FallbackResource /index.html
        # Only static GET/HEAD; no CGI, proxy, application handler or upload endpoint.
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Directory>
    # Enforce methods by URL as well: a release symlink or SPA fallback can
    # resolve outside the Directory path above.
    <Location "/">
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Location>
    <LocationMatch "(?:^|/)\.(?!well-known/)">
        Require all denied
    </LocationMatch>
    # Block source-looking URLs before the SPA fallback resolves to index.html.
    <LocationMatch "(?i)\.(?:py|pyc|env|sqlite3?|db|pem|key|log|ya?ml|toml|map)(?:$|/)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)\.(?:py|pyc|env|sqlite3?|db|pem|key|log|ya?ml|toml|map)$">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'"
    # Review mail/webmail/admin aliases separately; do not expose them via this site.
</VirtualHost>
