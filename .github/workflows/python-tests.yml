name: Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      # Tests mock external calls; these are deliberately non-secret placeholders.
      OPENAI_API_KEY: sk-test
      EXA_API_KEY: exa-test
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.22'
      - name: Run offline core and policy tests
        run: >-
          uv run --no-project --python '${{ matrix.python }}'
          --with 'pytest==8.3.5' --with 'python-dotenv==1.1.0'
          env PYTHONPATH=src python -m pytest
          --ignore=tests/test_llm_config.py --ignore=tests/test_crew_integration.py
