name: Daily cross-check

# Compares the live FinStats site with the official sources and opens (or updates, or
# closes) one GitHub issue. Read-only apart from that issue: no secrets beyond the
# default GITHUB_TOKEN, no AI, no paid services, no server access, no data fixes.
# 09:15 UTC is well after the 07:00 ONS release time and the collector's 30 minute cycle.
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Cross-check the live site against the official sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cross_check.py
